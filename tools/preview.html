<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1a1424}</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="../assets/ninja.js"></script>
<script>
THREE.ColorManagement.legacyMode=false;
const W=innerWidth,H=innerHeight, r=new THREE.WebGLRenderer({antialias:true}); r.setSize(W,H); r.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color('#2a2034');
s.add(new THREE.HemisphereLight(0x9a90c8,0x2a1a14,.7)); const d=new THREE.DirectionalLight(0xffd0a0,1.6); d.position.set(2,4,5); s.add(d);
const q=new URLSearchParams(location.search); const list=JSON.parse(q.get('l')||'[]'); const n=list.length;
const cam=new THREE.PerspectiveCamera(+q.get('fov')||30,W/H,.05,50); const sp=+(q.get('sp')||1.0);
cam.position.set(0,+(q.get('cy')||1.1),+(q.get('cz')||(n*0.9+2.2))); cam.lookAt(0,+(q.get('ty')||.95),0);
const ninjas=list.map((o,i)=>{ const N=NINJA.build(o); N.group.position.x=(i-(n-1)/2)*sp; N.group.rotation.y=o.ry||0; if(o.pose) N.setPose(o.pose,1); if(o.face) N.face.set(o.face); s.add(N.group); return N; });
let t=0; ninjas.forEach(N=>{ for(let i=0;i<30;i++) N.update(.05,t+=.05); });
r.render(s,cam); window.__done=true;
</script></body></html>
