<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Arashi Ninja</title>
<meta name="description" content="Look up your Arashi Academy ninja: rank, clan, seat, record and unlocked gear.">
<link rel="stylesheet" href="assets/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: two columns on desktop, the 3D ninja on the left and the ninja card on the right; stacked on phones. */
:root{ --ink:#120f0d; --paper:#f3eadb; --muted:#b0a28d; --card:#1b1612; --line:rgba(243,234,219,.14); --gold:#e7b54a; --vermilion:#d4452f;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN",Georgia,serif; --ui:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace; color-scheme:dark; }
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.me{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);margin-top:var(--navh);min-height:calc(100vh - var(--navh))}
.stage{position:relative;min-height:520px;overflow:hidden;border-right:1px solid var(--line)}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);z-index:2;transition:opacity .6s;font-family:var(--display);color:var(--gold);font-size:19px}
.views{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(22,18,15,.82);border:1px solid var(--line);border-radius:10px}
.views button{border:0;border-radius:7px;padding:7px 11px;cursor:pointer;background:transparent;font-size:13.5px;color:var(--muted)}
.views button[aria-pressed="true"]{color:var(--ink);background:var(--gold)}
.panel{padding-block:34px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0}
.panel h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,44px);margin:4px 0 0;line-height:1.05}
.find{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
.find span{color:var(--gold);font-family:var(--display);font-weight:800;font-size:19px;padding-left:8px}
.find input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;padding:8px 2px}
.find button{border:0;border-radius:7px;padding:10px 14px;background:var(--vermilion);color:#fff6ee;font-weight:700;cursor:pointer}
.ex{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ex button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:#d6cab6}
.ex button:hover{border-color:var(--gold);color:var(--paper)}
.miss{background:rgba(212,69,47,.12);border:1px solid rgba(212,69,47,.4);border-radius:10px;padding:10px 12px;font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px}
.exnote{font-size:12.5px;color:var(--muted);margin:0}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;word-break:break-all;line-height:1.1}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.12em;padding:4px 8px;border-radius:5px;color:var(--ink)}
.clan{display:inline-flex;align-items:center;gap:7px;font-size:14px}
.clan i{width:11px;height:11px;border-radius:3px;display:inline-block}
dl{margin:0;display:grid;gap:8px;font-size:14px}
dl div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px}
dt{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-top:2px}
dd{margin:0;min-width:0}
dd a{color:var(--gold);font-weight:700;text-decoration:none;margin-left:6px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b07a3a,#e7b54a)}
.gear h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.gear ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.gear li{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:rgba(255,255,255,.03)}
.gear li span{color:var(--muted);margin-right:6px;font-size:11px}
.gear.next li{border-style:dashed;color:#bdb2a2}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;text-decoration:none;font-size:14px;display:inline-block}
.btn.primary{background:var(--vermilion);color:#fff6ee}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--paper)}
@media (max-width:860px){ .me{grid-template-columns:1fr} .stage{min-height:0;height:58vh;border-right:0;border-bottom:1px solid var(--line)} }
</style>
</head>
<body>
<script src="assets/site.js"></script>
<main class="me">
  <section class="stage" aria-label="Your ninja in 3D, drag to rotate">
    <div id="scene"></div>
    <div id="loading">Finding your ninja…</div>
    <div class="views" role="group" aria-label="View">
      <button data-v="0" aria-pressed="true">Front</button><button data-v="1" aria-pressed="false">Side</button><button data-v="2" aria-pressed="false">Back</button><button data-v="spin" aria-pressed="false">Spin</button>
    </div>
  </section>
  <section class="panel">
    <div><p class="eyebrow">My Ninja</p><h1>Who are you in the academy?</h1></div>
    <form class="find" id="find" autocomplete="off">
      <span aria-hidden="true">@</span>
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your Instagram handle</label>
      <input id="q" placeholder="your_handle" spellcheck="false" autocapitalize="off" enterkeyhint="search">
      <button type="submit">Show my ninja</button>
    </form>
    <div class="ex"><span>Try:</span><span id="examples"></span></div>
    <p class="miss" id="miss" hidden></p>
    <article class="card" id="card" hidden>
      <p class="exnote" id="pExample" hidden>Example ninja. Type your handle above to see yours.</p>
      <div><h2 id="pHandle"></h2><div class="tags" style="margin-top:10px"><span class="pill" id="pRank"></span><span class="clan" id="pClan"></span></div></div>
      <dl>
        <div><dt>Seat</dt><dd><span id="pSeat"></span><a id="pSeatLink" href="index.html">Show in arena →</a></dd></div>
        <div><dt>Record</dt><dd id="pRec"></dd></div>
        <div><dt>Fights</dt><dd id="pFight"></dd></div>
      </dl>
      <div><div class="bar"><i id="pBar"></i></div><p style="margin:8px 0 0;font-size:13px;color:var(--muted)" id="pCount"></p></div>
      <div class="gear"><h3>Your gear</h3><ul id="pHave"></ul></div>
      <div class="gear next" id="pNextWrap"><h3 id="pNextH"></h3><ul id="pNext"></ul></div>
      <div class="acts"><a class="btn primary" id="pUp" href="ranks.html"></a><a class="btn ghost" id="pShop" href="shop.html">Open the shop</a></div>
    </article>
  </section>
</main>
<script src="assets/items.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(async function(){
const STAGE=document.querySelector('.stage'), SW=()=>STAGE.clientWidth, SH=()=>STAGE.clientHeight;
const V2=THREE.Vector2, V3=THREE.Vector3, UP=new V3(0,1,0);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
THREE.ColorManagement.legacyMode=false;
let small=SW()<760;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(77); const rr=(a,b)=>a+R()*(b-a);

const CLANS=[
  {name:'Ember',el:'Fire',c:'#d8452a',c2:'#f5a03a',ink:'#fff3e6',glyph:'fire'},
  {name:'Tide',el:'Water',c:'#2569b8',c2:'#36c6c0',ink:'#eaf8ff',glyph:'water'},
  {name:'Volt',el:'Lightning',c:'#e3bd1f',c2:'#8b4fd8',ink:'#2a1846',glyph:'bolt'},
  {name:'Gale',el:'Wind',c:'#e6ebe2',c2:'#3fa463',ink:'#1f5a35',glyph:'wind'},
  {name:'Stone',el:'Earth',c:'#8a5a33',c2:'#d9a63f',ink:'#fff1d6',glyph:'earth'},
];
const RANKS=[
  {n:'GENIN',col:'#b3aa9b',price:'Free · follow',tell:'Muted gray, steel plate, no armor'},
  {n:'CHUNIN',col:'#5fbf96',price:'$3 / month',tell:'Clan scarf, bronze plate, 1 gold stripe'},
  {n:'JONIN',col:'#e2583f',price:'$5 / month',tell:'Long coat, mask, katana, 2 gold stripes'},
  {n:'SENNIN',col:'#e7b54a',price:'$10 / month',tell:'White and gold, floating, crown and aura'},
];

try{ await Promise.race([document.fonts.load('800 40px "Shippori Mincho B1"'), new Promise(r=>setTimeout(r,2000))]); }catch(e){}

/* ---------- renderer + post ---------- */
const DPR=Math.min(devicePixelRatio, small?1.5:2);
const renderer=new THREE.WebGLRenderer({antialias:false}); 
renderer.setPixelRatio(DPR); renderer.setSize(SW(),SH());
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('scene').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x1a1424,9,30);
const camera=new THREE.PerspectiveCamera(small?42:34, SW()/SH(), .05, 200);
const controls=new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.enableZoom=false; controls.dampingFactor=.08; controls.minDistance=1.2; controls.maxDistance=14; controls.maxPolarAngle=Math.PI*.52;
const rt=new THREE.WebGLRenderTarget(SW()*DPR,SH()*DPR,{type:THREE.HalfFloatType,samples:renderer.capabilities.isWebGL2?4:0});
const composer=new THREE.EffectComposer(renderer,rt); composer.setPixelRatio(DPR); composer.setSize(SW(),SH());
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new V2(SW(),SH()),.6,.5,1.05); composer.addPass(bloom);
const grade=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:`uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
    void main(){ vec3 c=aces(texture2D(tDiffuse,vUv).rgb*1.1); c=pow(c,vec3(1./2.2));
      float l=dot(c,vec3(.299,.587,.114)); c=mix(c,c*vec3(.88,.95,1.12),(1.-l)*.35); c=mix(c,c*vec3(1.05,1.,.93),l*.2);
      c*=mix(.6,1.,smoothstep(.95,.3,length((vUv-.5)*vec2(1.2,1.))));
      c+=(fract(sin(dot(gl_FragCoord.xy+time*61.,vec2(12.9898,78.233)))*43758.5453)-.5)*.028;
      gl_FragColor=vec4(c,1.); }`});
composer.addPass(grade);

const grad=new THREE.DataTexture(new Uint8Array([70,70,70,255,140,140,140,255,205,205,205,255,255,255,255,255]),4,1,THREE.RGBAFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.needsUpdate=true;
const toon=(color,extra={})=>new THREE.MeshToonMaterial(Object.assign({color,gradientMap:grad},extra));
const outlineMat=new THREE.MeshBasicMaterial({color:0x0e0907,side:THREE.BackSide});
function outline(m,s=1.06){ const o=new THREE.Mesh(m.geometry,outlineMat); o.scale.setScalar(s); m.add(o); return m; }
const hdr=(r,g,b)=>new THREE.Color().setRGB(r,g,b);
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t; }
const glowTex=canvasTex(64,64,g=>{ const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.35,'rgba(255,255,255,.5)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=r; g.fillRect(0,0,64,64); });

/* ---------- stage ---------- */
scene.add(new THREE.HemisphereLight(0x8f87c7,0x22160f,.45));
const key=new THREE.DirectionalLight(0xffc28a,1.35); key.position.set(3,5,4.5); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-2,near:1,far:20}); key.shadow.bias=-.0004; key.shadow.normalBias=.02; scene.add(key);
const rim=new THREE.DirectionalLight(0x8aa2ff,1.2); rim.position.set(-3,3,-5); scene.add(rim);
const skyGeo=new THREE.SphereGeometry(80,32,16); { const p=skyGeo.attributes.position, col=new Float32Array(p.count*3), a=new THREE.Color('#0b0d1a'), b=new THREE.Color('#4a2638'), c=new THREE.Color();
  for(let i=0;i<p.count;i++){ const t=Math.max(0,p.getY(i)/80); c.copy(b).lerp(a,Math.pow(t,.5)); col.set([c.r,c.g,c.b],i*3); } skyGeo.setAttribute('color',new THREE.BufferAttribute(col,3)); }
scene.add(new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false})));
const floorTex=canvasTex(1024,1024,(g,S)=>{ const C=S/2; g.fillStyle='#3a332c'; g.fillRect(0,0,S,S);
  for(let r0=0;r0<C;r0+=64){ const n=Math.max(3,Math.round(2*Math.PI*(r0+32)/110)), off=R()*7; for(let k=0;k<n;k++){ const t0=off+k/n*Math.PI*2,t1=off+(k+1)/n*Math.PI*2;
    g.fillStyle=`hsl(${25+R()*12},${8+R()*6}%,${22+R()*9}%)`; g.beginPath(); if(r0===0) g.moveTo(C,C); else g.arc(C,C,r0,t0,t1); g.arc(C,C,r0+64,t1,t0,true); g.closePath(); g.fill(); g.strokeStyle='#17120e'; g.lineWidth=4; g.stroke(); } } });
const floor=new THREE.Mesh(new THREE.CircleGeometry(30,96),toon(0xffffff,{map:floorTex})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const PN=reduceMotion?60:240, pg=new THREE.BufferGeometry(), pp=new Float32Array(PN*3); for(let i=0;i<PN;i++) pp.set([rr(-8,8),rr(0,6),rr(-6,3)],i*3); pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const petals=new THREE.Points(pg,new THREE.PointsMaterial({color:0xf2a6c0,size:.05,map:glowTex,transparent:true,depthWrite:false})); scene.add(petals);
const lanterns=[]; for(let i=0;i<14;i++){ const l=new THREE.Mesh(new THREE.CylinderGeometry(.09,.07,.18,8),new THREE.MeshBasicMaterial({color:hdr(rr(2,3),rr(1,1.4),.35)})); l.position.set(rr(-9,9),rr(1.5,7),rr(-9,-4)); l.userData.v=rr(.05,.15); scene.add(l); lanterns.push(l); }

/* ---------- helpers for building characters ---------- */
function add(g,geo,mat,pos,rot,scl,o=1.06){ const m=new THREE.Mesh(geo,mat); if(pos) m.position.set(...pos); if(rot) m.rotation.set(...rot); if(scl) m.scale.set(...scl); g.add(o?outline(m,o):m); return m; }
function seg(g,mat,a,b,r1,r2,o=1.08,rad=14){ const A=new V3(...a),B=new V3(...b),d=B.clone().sub(A),len=d.length(); const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,len,rad),mat); m.position.copy(A).addScaledVector(d,.5); m.quaternion.setFromUnitVectors(UP,d.normalize()); g.add(o?outline(m,o):m); return m; }
function cone(g,mat,base,dir,r,h,o=1.1){ const D=new V3(...dir).normalize(); const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),mat); m.position.set(...base).addScaledVector(D,h*.5); m.quaternion.setFromUnitVectors(UP,D); g.add(o?outline(m,o):m); return m; }
function drawGlyph(g,c,x,y,s){ g.fillStyle=c.ink; g.strokeStyle=c.ink; g.lineWidth=12; g.lineCap='round'; g.lineJoin='round'; g.save(); g.translate(x,y); g.scale(s,s);
  if(c.glyph==='fire'){ g.beginPath(); g.moveTo(0,-90); g.bezierCurveTo(80,-10,70,80,0,90); g.bezierCurveTo(-70,80,-80,-10,-20,-40); g.bezierCurveTo(-20,0,0,10,0,-90); g.fill(); }
  if(c.glyph==='water'){ for(let i=-1;i<=1;i++){ g.beginPath(); for(let s2=0;s2<=40;s2++){ const px=-80+s2*4, py=i*50+Math.sin(s2/40*Math.PI*3)*16; s2?g.lineTo(px,py):g.moveTo(px,py);} g.stroke(); } }
  if(c.glyph==='bolt'){ g.beginPath(); g.moveTo(20,-95); g.lineTo(-50,15); g.lineTo(-2,15); g.lineTo(-24,100); g.lineTo(52,-15); g.lineTo(4,-15); g.closePath(); g.fill(); }
  if(c.glyph==='wind'){ [[-20,-45,52],[10,25,40],[-30,70,26]].forEach(([dx,dy,r])=>{ g.beginPath(); g.arc(dx,dy,r,Math.PI*.9,Math.PI*2.6); g.lineTo(dx-r*2.2,dy+r); g.stroke(); }); }
  if(c.glyph==='earth'){ g.beginPath(); g.moveTo(-90,80); g.lineTo(-25,-50); g.lineTo(10,5); g.lineTo(40,-80); g.lineTo(95,80); g.closePath(); g.fill(); }
  g.restore(); }
function plateTex(metal,line){ return canvasTex(256,128,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,w,h); gr.addColorStop(0,metal[0]); gr.addColorStop(.5,metal[1]); gr.addColorStop(1,metal[0]); g.fillStyle=gr; g.fillRect(0,0,w,h);
  g.strokeStyle=line; g.lineWidth=6; g.strokeRect(6,6,w-12,h-12); const cx=w/2,cy=h/2+4;
  g.lineWidth=5; g.beginPath(); g.arc(cx,cy,40,0,7); g.stroke(); g.fillStyle=line; g.beginPath(); g.moveTo(cx-30,cy+20); g.lineTo(cx,cy-24); g.lineTo(cx+30,cy+20); g.closePath(); g.fill();
  g.lineWidth=4; [[-52,-36,1],[-2,-48,.3],[48,-36,-1]].forEach(([dx,dy,s])=>{ g.beginPath(); g.moveTo(cx+dx,cy+dy); g.lineTo(cx+dx+6*s,cy+dy+12); g.lineTo(cx+dx-3*s,cy+dy+14); g.lineTo(cx+dx+4*s,cy+dy+28); g.stroke(); }); }); }
const PLATES=[plateTex(['#7f8891','#c3cad1'],'#2a2e33'), plateTex(['#7a4f22','#d29a52'],'#3a220c'), plateTex(['#3b3f47','#8d939c'],'#e7b54a')];

const skinM=toon(0xe7b28c), eyeM=toon(0x15100e), whiteM=new THREE.MeshBasicMaterial({color:0xffffff}), mouthM=toon(0x7a3a30);
function head(g,o){ add(g,new THREE.CylinderGeometry(.05,.056,.13,12),skinM,[0,1.455,0],null,null,0);
  add(g,new THREE.SphereGeometry(.165,24,18),skinM,[0,1.6,0],null,[1,1.08,1],1.05);
  [-1,1].forEach(s=>{ add(g,new THREE.SphereGeometry(.04,12,8),skinM,[s*.162,1.59,0],null,[.4,.75,.6],0);
    if(o.eyes){ const e=new THREE.Mesh(new THREE.SphereGeometry(.027,12,10),o.eyes); e.position.set(s*.058,1.6,.148); e.scale.set(.85,1.25,.4); g.add(e); }
    else { add(g,new THREE.SphereGeometry(.027,12,10),eyeM,[s*.058,1.6,.148],null,[.85,1.25,.4],0); add(g,new THREE.SphereGeometry(.009,8,6),whiteM,[s*.052,1.615,.158],null,null,0); }
    add(g,new THREE.BoxGeometry(.05,.011,.012),eyeM,[s*.06,1.648,.152],[0,0,-s*(o.brow||.22)],null,0); });

      if(cur.rank===2&&ninja.userData.wisps) ninja.userData.wisps.forEach(w=>{ const u=w.userData, a=t*2.2+u.p; w.position.set(u.s*.395+Math.cos(a)*.07,.8+((t*.5+u.p/7)%1)*.25,.045+Math.sin(a)*.07); w.material.opacity=.75*(1-((t*.5+u.p/7)%1)); });
      if(cur.rank===3&&ninja.userData.inner){ ninja.userData.inner.position.y=.12+Math.sin(t*1.4)*.035; ninja.userData.scroll.rotation.y=Math.PI-.75+Math.sin(t*.5)*.9;
        const Au=ninja.userData.aura, ap=Au.geo.attributes.position; Au.data.forEach((d,i)=>{ d.y+=dt*d.v; if(d.y>2.1) d.y=0; const a=d.a+t*.3; ap.setXYZ(i,Math.sin(a)*d.r,d.y+.1,Math.cos(a)*d.r*.8); }); ap.needsUpdate=true; } } }
  if(!reduceMotion){ const pa=pg.attributes.position; for(let i=0;i<PN;i++){ let y=pa.getY(i)-dt*.25, x=pa.getX(i)+Math.sin(t+i)*dt*.15+dt*.1; if(y<0) y=6; if(x>8) x=-8; pa.setX(i,x); pa.setY(i,y); } pa.needsUpdate=true; }
  grade.uniforms.time.value=t%100; controls.update(); composer.render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
